# XcodeGen spec. CI (.github/workflows/ios.yml) copies the web app into Web/, then runs `xcodegen generate`.
name: Murmurcut
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Murmurcut:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.murmurcut
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: murmurcut
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Film a new video to caption.
        NSMicrophoneUsageDescription: Record sound with the video you film.
        NSPhotoLibraryAddUsageDescription: Save your finished videos to Photos.
        NSSpeechRecognitionUsageDescription: Turn what you say into captions, on your phone.
        UILaunchScreen: {}
        # Shows Documents/murmurcut-log.txt in the Files app, so the user can send it with a bug report.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  MurmurcutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Murmurcut
schemes:
  Murmurcut:
    build:
      targets:
        Murmurcut: all
    test:
      targets: [MurmurcutTests]
