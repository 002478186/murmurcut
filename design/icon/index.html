<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024, height=1024" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1024px; height: 1024px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; }
      .icon { position: absolute; inset: 0; }
      svg { width: 1024px; height: 1024px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1024" data-height="1024">
      <svg width="0" height="0" style="position: absolute">
        <defs>
          <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF4D8D" />
            <stop offset="1" stop-color="#7B4DFF" />
          </linearGradient>
          <radialGradient id="shine" cx="0.25" cy="0.15" r="0.75">
            <stop offset="0" stop-color="#fff" stop-opacity="0.28" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <!-- the play mark, rounded by a same-colour stroke -->
          <polygon id="play" points="400,262 400,598 690,430" stroke-linejoin="round" stroke-width="70" />
          <clipPath id="left"><polygon points="0,0 560,0 480,1024 0,1024" /></clipPath>
          <clipPath id="right"><polygon points="600,0 1024,0 1024,1024 520,1024" /></clipPath>
        </defs>
      </svg>

      <!-- A: a play mark sliced by a cut, over a caption line with its spoken word lit -->
      <div id="a" class="icon clip" data-start="0" data-duration="1" data-track-index="0">
        <svg viewBox="0 0 1024 1024">
          <rect width="1024" height="1024" fill="url(#brand)" />
          <rect width="1024" height="1024" fill="url(#shine)" />
          <use href="#play" fill="#fff" stroke="#fff" clip-path="url(#left)" />
          <g transform="translate(16,-20)"><use href="#play" fill="#fff" stroke="#fff" clip-path="url(#right)" /></g>
          <rect x="296" y="716" width="132" height="68" rx="34" fill="#fff" fill-opacity="0.92" />
          <rect x="452" y="716" width="184" height="68" rx="34" fill="#FFD60A" />
          <rect x="660" y="716" width="68" height="68" rx="34" fill="#fff" fill-opacity="0.92" />
        </svg>
      </div>

      <!-- B: a caption bubble with the play mark cut out of it -->
      <div id="b" class="icon clip" data-start="1" data-duration="1" data-track-index="0">
        <svg viewBox="0 0 1024 1024">
          <rect width="1024" height="1024" fill="url(#brand)" />
          <rect width="1024" height="1024" fill="url(#shine)" />
          <path d="M330 232 H694 A130 130 0 0 1 824 362 V600 A130 130 0 0 1 694 730 H430 L300 836 L318 730 H330 A130 130 0 0 1 200 600 V362 A130 130 0 0 1 330 232 Z" fill="#fff" />
          <g transform="translate(-34,51) scale(1)"><use href="#play" fill="url(#brand)" stroke="url(#brand)" transform="translate(512,430) scale(0.72) translate(-540,-430)" /></g>
          <rect x="694" y="640" width="70" height="40" rx="20" fill="#FFD60A" />
        </svg>
      </div>

      <!-- C: A on black, the mark in the brand gradient -->
      <div id="c" class="icon clip" data-start="2" data-duration="1" data-track-index="0">
        <svg viewBox="0 0 1024 1024">
          <rect width="1024" height="1024" fill="#0B0B12" />
          <use href="#play" fill="url(#brand)" stroke="url(#brand)" clip-path="url(#left)" />
          <g transform="translate(16,-20)"><use href="#play" fill="url(#brand)" stroke="url(#brand)" clip-path="url(#right)" /></g>
          <rect x="296" y="716" width="132" height="68" rx="34" fill="#fff" />
          <rect x="452" y="716" width="184" height="68" rx="34" fill="#FFD60A" />
          <rect x="660" y="716" width="68" height="68" rx="34" fill="#fff" />
        </svg>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
